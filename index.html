<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Saya</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #fff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  text-align: center;
}
h1 { font-size: 2.2em; margin-bottom: 15px; }
p { font-size: 1.1em; margin-bottom: 25px; opacity: 0.95; }
.card {
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(10px);
  padding: 30px;
  border-radius: 16px;
  max-width: 400px;
  width: 100%;
  border: 1px solid rgba(255,255,255,0.25);
}
button {
  background: #fff;
  color: #764ba2;
  border: none;
  padding: 12px 28px;
  border-radius: 8px;
  font-size: 1em;
  font-weight: bold;
  cursor: pointer;
  margin-top: 15px;
}
button:active { transform: scale(0.97); }
footer {
  position: fixed;
  bottom: 15px;
  font-size: 0.85em;
  opacity: 0.8;
}
</style>
</head>
<body>
<div class="card">
  <h1>Halo! 👋</h1>
  <p>Ini website pertama saya, dibuat full dari HP.</p>
  <button onclick="document.getElementById('msg').innerText='Tombol berfungsi! ✅'">Klik Saya</button>
  <p id="msg" style="margin-top:20px;font-size:0.95em;"></p>
</div>
<footer>© 2025 Website Saya</footer>
</body>
</html>
