<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INK TOOLS - Dual UI</title>
<style>
    /* === GLOBAL RESET & FONTS === */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    @import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=M+PLUS+Rounded+1c:wght@400;700&display=swap');

    body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
        transition: background 0.5s ease, color 0.5s ease;
    }

    /* === TEMA 1: BENDY & THE INK MACHINE === */
    body.theme-bendy {
        font-family: 'Special Elite', 'Courier New', monospace;
        background-color: #0a0a0a;
        background-image: 
            radial-gradient(circle at 50% 0%, #2a2200 0%, transparent 60%),
            repeating-linear-gradient(0deg, transparent, transparent 1px, rgba(255, 215, 0, 0.03) 1px, rgba(255, 215, 0, 0.03) 2px);
        color: #e0e0e0;
    }
    .theme-bendy .ui-card, .theme-bendy .sidebar { background: rgba(15, 15, 15, 0.95); border: 2px solid #d4af37; border-radius: 4px; box-shadow: 0 0 20px rgba(212, 175, 55, 0.2); }
    .theme-bendy h1 { color: #d4af37; text-shadow: 0 0 10px rgba(212, 175, 55, 0.5); letter-spacing: 2px; text-transform: uppercase; }
    .theme-bendy .subtitle { color: #888; letter-spacing: 1px; }
    .theme-bendy .btn { background: transparent; color: #d4af37; border: 1px solid #d4af37; }
    .theme-bendy .btn:hover { background: #d4af37; color: #0a0a0a; box-shadow: 0 0 15px rgba(212, 175, 55, 0.6); }

    /* === TEMA 2: SAIKI KUSUO === */
    body.theme-saiki {
        font-family: 'M PLUS Rounded 1c', sans-serif;
        background: linear-gradient(135deg, #e0f7fa 0%, #b2ebf2 100%);
        color: #006064;
    }
    .theme-saiki .ui-card, .theme-saiki .sidebar { background: rgba(255, 255, 255, 0.95); border: 3px solid #00bcd4; border-radius: 20px; box-shadow: 0 10px 25px rgba(0, 188, 212, 0.3); }
    .theme-saiki h1 { color: #00838f; text-shadow: 2px 2px 0px #ffffff; font-weight: 700; }
    .theme-saiki .subtitle { color: #4dd0e1; font-weight: bold; }
    .theme-saiki .btn { background: #00bcd4; color: #ffffff; border: none; border-radius: 12px; font-weight: bold; }
    .theme-saiki .btn:hover { background: #00838f; }

    /* === NAVBAR & SIDEBAR MENU === */
    .navbar { width: 100%; height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; position: fixed; top: 0; z-index: 100; backdrop-filter: blur(5px); }
    .theme-bendy .navbar { background: rgba(10, 10, 10, 0.8); border-bottom: 1px solid #d4af37; }
    .theme-saiki .navbar { background: rgba(255, 255, 255, 0.8); border-bottom: 2px solid #00bcd4; }

    .hamburger { font-size: 30px; cursor: pointer; user-select: none; }
    .theme-bendy .hamburger { color: #d4af37; }
    .theme-saiki .hamburger { color: #00838f; }

    .secret-admin-btn { width: 25px; height: 25px; cursor: pointer; opacity: 0.1; transition: 0.3s; }
    .secret-admin-btn:hover { opacity: 1; }
    .theme-bendy .secret-admin-btn { background: #d4af37; border-radius: 50%; }
    .theme-saiki .secret-admin-btn { background: #00bcd4; border-radius: 50%; }

    .sidebar { position: fixed; top: 0; left: -350px; width: 320px; height: 100%; padding: 80px 20px 20px; transition: 0.4s; z-index: 200; overflow-y: auto; }
    .sidebar.active { left: 0; }
    .sidebar h2 { font-size: 1.2em; margin-bottom: 20px; text-align: center; }
    .theme-bendy .sidebar h2 { color: #d4af37; border-bottom: 1px solid #333; padding-bottom: 10px; }
    .theme-saiki .sidebar h2 { color: #00838f; border-bottom: 2px dashed #b2ebf2; padding-bottom: 10px; }

    .sidebar ul { list-style: none; margin-bottom: 25px; }
    .sidebar ul li { margin-bottom: 12px; }
    .sidebar ul li a { text-decoration: none; display: block; padding: 12px; transition: 0.3s; font-size: 1em; }
    .theme-bendy .sidebar ul li a { color: #e0e0e0; border-left: 3px solid transparent; }
    .theme-bendy .sidebar ul li a:hover { background: #222; border-left: 3px solid #d4af37; color: #d4af37; }
    .theme-saiki .sidebar ul li a { color: #006064; border-radius: 10px; font-weight: bold; }
    .theme-saiki .sidebar ul li a:hover { background: #e0f7fa; padding-left: 20px; }

    /* === MAIN CONTENT === */
    .main-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 20px 40px; text-align: center; z-index: 10; }
    .ui-card { padding: 40px 30px; max-width: 400px; width: 100%; }
    h1 { font-size: 2.2em; margin-bottom: 10px; }
    .subtitle { font-size: 0.9em; margin-bottom: 35px; }
    .links-container { display: flex; flex-direction: column; gap: 15px; }
    .btn { display: flex; align-items: center; justify-content: center; padding: 15px; text-decoration: none; font-size: 1.1em; transition: all 0.3s ease; cursor: pointer; width: 100%; }

    /* === OVERLAY === */
    .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 150; display: none; opacity: 0; transition: 0.3s; }
    .overlay.active { display: block; opacity: 1; }
    .theme-saiki .overlay { background: rgba(255,255,255,0.5); backdrop-filter: blur(2px); }

    /* === SWITCH UI BUTTON === */
    .switch-ui { position: fixed; bottom: 20px; right: 20px; padding: 10px 20px; border-radius: 30px; font-weight: bold; cursor: pointer; z-index: 100; border: none; font-family: inherit; }
    .theme-bendy .switch-ui { background: #d4af37; color: #000; }
    .theme-saiki .switch-ui { background: #00bcd4; color: #fff; }
</style>
</head>
<body class="theme-bendy">

<!-- Navbar dengan Tombol Admin Rahasia -->
<div class="navbar">
    <div class="hamburger" onclick="toggleSidebar()">☰</div>
    <div class="secret-admin-btn" onclick="openAdminLogin()" title="Admin Area"></div>
</div>

<!-- Sidebar Menu -->
<div class="sidebar" id="mySidebar">
    <h2>TOOLS MENU</h2>
    <ul>
        <!-- Tombol AM diarahkan ke fungsi JavaScript (WA) -->
        <li><a href="#" onclick="handleAMClick()">✨ Alight Motion Premium</a></li>
    </ul>
</div>

<!-- Overlay -->
<div class="overlay" id="myOverlay" onclick="toggleSidebar()"></div>

<!-- Main Content -->
<div class="main-content">
    <div class="ui-card">
        <h1 id="judul">INK TOOLS</h1>
        <p class="subtitle" id="subjudul">[ STUDIO & CREATIONS ]</p>
        <div class="links-container">
            <a href="#" class="btn" onclick="toggleTheme()">Ubah UI (Bendy / Saiki)</a>
        </div>
    </div>
</div>

<button class="switch-ui" onclick="toggleTheme()">Switch UI</button>

<script>
    // ==========================================
    // 1. SISTEM ADMIN & LOCAL STORAGE
    // ==========================================
    
    // Sandi Rahasia Admin (GANTI INI JIKA MAU SANDI LAIN)
    const ADMIN_PASSWORD = "rahasia123"; 
    const AM_STATUS_KEY = "alightMotionStatus";

    // Cek status AM saat halaman dimuat (Default: ON)
    document.addEventListener("DOMContentLoaded", () => {
        if(localStorage.getItem(AM_STATUS_KEY) === null) {
            localStorage.setItem(AM_STATUS_KEY, "ON");
        }
    });

    function openAdminLogin() {
        let pass = prompt("Masukkan Sandi Admin:");
        if (pass === ADMIN_PASSWORD) {
            let currentStatus = localStorage.getItem(AM_STATUS_KEY);
            let newStatus = currentStatus === "ON" ? "OFF" : "ON";
            localStorage.setItem(AM_STATUS_KEY, newStatus);
            alert("Berhasil! Status Alight Motion sekarang: " + newStatus);
        } else if (pass !== null) {
            alert("Sandi Salah! Akses Ditolak.");
        }
    }

    // ==========================================
    // 2. LOGIKA ALIGHT MOTION (REDIRECT KE WA)
    // ==========================================
    function handleAMClick() {
        // Cek status ON/OFF dari Admin
        let status = localStorage.getItem(AM_STATUS_KEY);
        if(status === "OFF") {
            alert("⛔ MAAF, LINK ALIGHT MOTION PREMIUM SEDANG DITUTUP OLEH ADMIN.");
            return;
        }

        // Jika ON, arahkan ke WhatsApp
        // Nomor WA: 6285147055542 (Tanpa tanda + dan spasi)
        let nomorWA = "6285147055542";
        let pesanTeks = encodeURIComponent("Halo Admin, saya mau minta link Alight Motion Premium yang ada di website INK TOOLS.");
        
        // Membuka link WhatsApp di tab baru
        window.open("https://wa.me/" + nomorWA + "?text=" + pesanTeks, "_blank");
    }

    // ==========================================
    // 3. LOGIKA UI & TEMA (BENDY / SAIKI)
    // ==========================================
    function toggleSidebar() {
        document.getElementById("mySidebar").classList.toggle("active");
        document.getElementById("myOverlay").classList.toggle("active");
    }

    let isBendy = true;
    function toggleTheme() {
        const body = document.body;
        const judul = document.getElementById("judul");
        const subjudul = document.getElementById("subjudul");

        if (isBendy) {
            body.classList.replace("theme-bendy", "theme-saiki");
            judul.innerText = "SAIKI K.";
            subjudul.innerText = "PK Academy Tools";
            isBendy = false;
        } else {
            body.classList.replace("theme-saiki", "theme-bendy");
            judul.innerText = "INK TOOLS";
            subjudul.innerText = "[ STUDIO & CREATIONS ]";
            isBendy = true;
        }
    }
</script>

</body>
</html>
